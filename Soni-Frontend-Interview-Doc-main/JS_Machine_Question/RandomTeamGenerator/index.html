<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Team Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <h2>🎲 Random Team Generator</h2>
    <div class="form-group">
      <label for="participants-input">Participant Names:</label>
      <textarea id="participants-input" data-testid="participants-input" rows="5" placeholder="Enter names (comma separated or one per line)"></textarea>
    </div>
    <div class="form-group">
      <label for="team-count-input">Number of Teams:</label>
      <input type="number" id="team-count-input" data-testid="team-count-input" placeholder="e.g. 3" />
    </div>
    <div class="actions">
      <button id="generate-teams-button" data-testid="generate-teams-button">Generate Teams</button>
      <button id="reset-button" data-testid="reset-button" class="secondary">Reset</button>
    </div>
    <div id="error-message" class="error-msg" style="display: none;"></div>
    <div id="teams-output" class="teams-container"></div>
  </div>
  <script src="index.js"></script>
</body>
</html>
