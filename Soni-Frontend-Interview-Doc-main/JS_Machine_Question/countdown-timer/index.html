<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Countdown Timer Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>Countdown Timer</h2>
    <p class="subtitle">Exact question practice: timer initialization, start/pause/reset, interval cleanup, and state management.</p>

    <div class="timer-display" id="timer-display">00:00:00</div>

    <div class="inputs-container">
      <div class="input-group">
        <label for="hours">Hours</label>
        <input type="number" id="hours" min="0" max="99" value="0" />
      </div>
      <div class="input-group">
        <label for="minutes">Minutes</label>
        <input type="number" id="minutes" min="0" max="59" value="5" />
      </div>
      <div class="input-group">
        <label for="seconds">Seconds</label>
        <input type="number" id="seconds" min="0" max="59" value="0" />
      </div>
    </div>

    <div class="controls">
      <button id="start-btn">Start</button>
      <button id="pause-btn" disabled class="secondary-btn">Pause</button>
      <button id="reset-btn" class="danger-btn">Reset</button>
    </div>

    <div id="status-msg" class="status-msg">Set timer and press Start</div>
  </div>

  <script src="index.js"></script>
</body>
</html>
